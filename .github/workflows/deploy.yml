name: Deploy to Vimexx via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Sync files via lftp
      run: |
        sudo apt-get update && sudo apt-get install -y lftp
        lftp -c "set ftp:ssl-allow yes; set ssl:verify-certificate no; set ftp:passive-mode true; open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }}; mirror -R ./dist/ ./domains/sintzaken.nl/public_html/ --parallel=10 --exclude-glob .git*"
